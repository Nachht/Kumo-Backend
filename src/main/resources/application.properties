# 1. NOMBRE DE LA APLICACIÓN
spring.application.name=kumo-backend

# 2. PUERTO DEL SERVIDOR
server.port=8080

# 3. CONEXIÓN A MySQL Prod (USANDO VARIABLES DE ENTORNO)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. CONEXIÓN A MySQL a Desarrollo
#spring.datasource.url=jdbc:mysql://localhost:3306/kumo_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. CONFIGURACIÓN DE JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 5. CONFIGURACIÓN DE LOGGING
logging.level.com.kumo=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

